[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-inspector"
version = "0.1.0"
description = "Audit MCP tool schemas for injection, ambiguity, and destructive verbs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "khawajasafiullah18" }]
dependencies = []
keywords = ["mcp", "security", "agents", "tools", "audit"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/aiplusplus360/mcp-inspector"

[project.scripts]
mcp-inspector = "mcpinspector.cli:main"

[tool.setuptools.packages.find]
include = ["mcpinspector*"]
